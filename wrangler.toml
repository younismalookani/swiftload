# SwiftLoad — Cloudflare Pages Configuration
# https://developers.cloudflare.com/pages/

name = "swiftload"
pages_build_output_dir = "public"
compatibility_date = "2024-09-02"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[build]
command = ""

[[build.environment_variables]]
name = "NODE_VERSION"
value = "18"
